name: CI

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: |
        python unit/unit_check.py
    
    - name: Test canonicalize module
      run: |
        python -c "from utils.canonicalize import canonicalize_json; print(canonicalize_json({'b': 2, 'a': 1}))"
    
    - name: Test policy engine
      run: |
        python policy_engine/policy_engine.py
    
    - name: Test simulator
      run: |
        python sim/rescaled_sim_events_fixed.py
    
    - name: Verify safe defaults
      run: |
        python -c "import json; spec = json.load(open('ethics/ethics_spec.json')); assert spec['safe_defaults']['network_calls'] == False; assert spec['safe_defaults']['manual_approval_required'] == True; print('Safe defaults verified')"
